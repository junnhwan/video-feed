<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23fe2c55'/><polygon points='13,10 13,22 23,16' fill='%23fff'/></svg>" />
    <title>ShortVideo</title>
    <style>
      /* Inline loader – eliminated white flash */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f7f8fa;
      }
      #root:empty::after {
        content: '';
        width: 36px;
        height: 36px;
        border: 3px solid rgba(0,0,0,.08);
        border-top-color: #fe2c55;
        border-radius: 50%;
        animation: _bootSpin .7s linear infinite;
      }
      @keyframes _bootSpin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
